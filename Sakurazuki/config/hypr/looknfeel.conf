# Sakurazuki Look & Feel for Hyprland
# Japanese Cherry Blossom / Midnight Plum aesthetic

# Variables for Sakurazuki border (using Hyprland RRGGBBAA hex format)
$sakuraActiveBorder = rgba(a87692ee) rgba(d9a6c4ee) 45deg
$sakuraInactiveBorder = rgba(443043aa)

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = $sakuraActiveBorder
    col.inactive_border = $sakuraInactiveBorder
    resize_on_border = true
}

decoration {
    # Sakurazuki smooth rounded window corners
    rounding = 14

    active_opacity = 1.0
    inactive_opacity = 0.96

    # Sakurazuki dark plum drop shadows
    shadow {
        enabled = true
        range = 22
        render_power = 3
        color = rgba(14111a77)
        color_inactive = rgba(14111a33)
    }

    # Soft frosted glass blur
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.012
        vibrancy = 0.22
        popups = false
    }
}

group {
    col.border_active = $sakuraActiveBorder
    col.border_inactive = $sakuraInactiveBorder
}

cursor {
    no_hardware_cursors = true
    hide_on_key_press = false
    hide_on_touch = false
    inactive_timeout = 0
    invisible = false
    warp_on_change_workspace = 1
}

# Smooth Sakurazuki transitions (200-300ms)
animations {
    enabled = true

    bezier = sakuraEase, 0.16, 1, 0.3, 1
    bezier = sakuraFade, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 3.0, sakuraEase
    animation = windowsIn, 1, 3.0, sakuraEase, popin 92%
    animation = windowsOut, 1, 2.2, sakuraEase, popin 92%
    animation = fadeIn, 1, 2.5, sakuraFade
    animation = fadeOut, 1, 2.0, sakuraFade
    animation = fade, 1, 2.8, sakuraEase
    animation = fadeSwitch, 1, 2.4, sakuraEase
    animation = layers, 1, 3.0, sakuraEase
    animation = layersIn, 1, 3.0, sakuraEase, fade
    animation = layersOut, 1, 2.0, sakuraFade, fade
    animation = workspaces, 1, 3.2, sakuraEase, slide
    animation = specialWorkspace, 1, 3.2, sakuraEase, slidevert
}
