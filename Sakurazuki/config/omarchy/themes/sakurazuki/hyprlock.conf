# Sakurazuki Lock Screen for Hyprlock
# Clean, crisp background with high-contrast visibility and Japanese aesthetic

general {
    ignore_empty_input = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/.local/state/omarchy/current/background
    color = rgba(25, 25, 28, 1.0)
    blur_passes = 0
}

animations {
    enabled = true
    bezier = sakuraEase, 0.16, 1, 0.3, 1
    bezier = sakuraFade, 0.25, 0.1, 0.25, 1

    animation = fadeIn, 1, 3.0, sakuraFade
    animation = fadeOut, 1, 2.5, sakuraFade
    animation = inputFieldFade, 1, 2.5, sakuraEase
    animation = inputFieldColors, 1, 2.5, sakuraEase
}

# Clock (High visibility)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 84
    font_family = Inter Bold, JetBrainsMono Nerd Font Bold

    position = 0, 240
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.5)
}

# Date (Standard date format preserved)
label {
    monitor =
    text = cmd[update:1000] echo "🌸 $(date +"%A, %B %d")"
    color = rgba(217, 166, 196, 0.85)
    font_size = 17
    font_family = Inter SemiBold, JetBrainsMono Nerd Font

    position = 0, 175
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# Luffy Profile Avatar
image {
    monitor =
    path = ~/.config/omarchy/assets/avatar_sakurazuki.png
    size = 110
    rounding = -1
    border_size = 2
    border_color = rgba(217, 166, 196, 0.75)

    position = 0, 30
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

# User Name in Theme Language (ミハル)
label {
    monitor =
    text = ミハル
    color = rgba(255, 255, 255, 0.95)
    font_size = 19
    font_family = Inter SemiBold, JetBrainsMono Nerd Font Bold

    position = 0, -48
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.35)
}

# Subtitle (桜月 · ロック中)
label {
    monitor =
    text = 桜月 · ロック中
    color = rgba(217, 166, 196, 0.85)
    font_size = 12
    font_family = Inter, JetBrainsMono Nerd Font

    position = 0, -70
    halign = center
    valign = center

    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.35)
}

# Password Input Field (High visibility pill with Japanese text)
input-field {
    monitor =
    size = 270, 44
    position = 0, -114
    halign = center
    valign = center

    inner_color = rgba(33, 25, 37, 0.90)
    outer_color = rgba(217, 166, 196, 0.65)
    outline_thickness = 2
    rounding = -1

    font_family = Inter, JetBrainsMono Nerd Font
    font_color = rgba(255, 255, 255, 0.95)

    placeholder_text = <i>󰌾  パスワードを入力…</i>
    check_color = rgba(168, 197, 160, 0.85)
    fail_color = rgba(229, 139, 154, 0.85)
    fail_text = <i>パスワードが違います ($ATTEMPTS)</i>

    dots_size = 0.25
    dots_spacing = 0.22
    dots_center = true

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
    fade_on_empty = false
}

auth {
    fingerprint:enabled = false
}
