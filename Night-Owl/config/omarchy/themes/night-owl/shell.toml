# Night Owl Omarchy shell surfaces.
# Canonical palette by Sarah Drasner.

[bar]
background       = "#011627"
background-alpha = 0.94
text             = "#D6DEEB"
active           = "#7FDBCA"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#7FDBCA #82AAFF 45deg"
active-border-foreground = "#7FDBCA"

[controls]
normal-color        = "#D6DEEB"
normal-fill-alpha   = 0.05
normal-border       = "#1D3B53"
normal-border-width = 1
normal-border-alpha = 0.6

hover-cursor-color        = "#D6DEEB"
hover-cursor-fill-alpha   = 0.12
hover-cursor-border       = "#82AAFF"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.4

focus-color        = "#D6DEEB"
focus-fill-alpha   = 0.12
focus-border       = "#7FDBCA"
focus-border-width = 1
focus-border-alpha = 0.5

selected-color        = "#011627"
selected-fill-alpha   = 0.95
selected-border       = "#7FDBCA"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.25
selection-fill-alpha = 0.35

[spacing]
scale           = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#0B253A"
background-alpha = 0.96
text             = "#D6DEEB"
border           = "#1D3B53"
border-alpha     = 0.85

[tooltip]
background       = "#011627"
background-alpha = 0.96
text             = "#D6DEEB"
border           = "#80A4C2"
border-alpha     = 0.4

[notifications]
background       = "#0B253A"
background-alpha = 0.96
text             = "#D6DEEB"
border           = "#7FDBCA"
border-alpha     = 0.9
countdown        = "#7FDBCA"

[launcher]
background                = "#0B253A"
background-alpha          = 0.96
text                      = "#D6DEEB"
border                    = "#7FDBCA"
border-alpha              = 0.8
scrim                     = "#010E1A"
scrim-alpha               = 0.65
selected-background       = "#1D3B53"
selected-background-alpha = 0.45
selected-text             = "#7FDBCA"
selected-border           = "#7FDBCA"
selected-border-alpha     = 0.5

[menu]
background                = "#0B253A"
background-alpha          = 0.96
text                      = "#D6DEEB"
border                    = "#1D3B53"
border-alpha              = 0.8
scrim                     = "#010E1A"
scrim-alpha               = 0.65
selected-background       = "#1D3B53"
selected-background-alpha = 0.45
selected-text             = "#7FDBCA"
selected-border           = "#7FDBCA"
selected-border-alpha     = 0.5

[polkit]
background       = "#0B253A"
background-alpha = 0.96
text             = "#D6DEEB"
text-error       = "#FF6363"
border           = "#7FDBCA"
border-error     = "#FF2C83"
border-alpha     = 0.9
scrim            = "#010E1A"
scrim-alpha      = 0.65
accent           = "#7FDBCA"

[lock]
background       = "#0B253A"
background-alpha = 0.88
text             = "#D6DEEB"
placeholder      = "#637777"
text-error       = "#FF6363"
border           = "#7FDBCA"
border-active    = "#82AAFF"
border-error     = "#FF2C83"
border-alpha     = 0.9
selection        = "#7FDBCA"
selection-alpha  = 0.45

[image-picker]
scrim                   = "#010E1A"
scrim-alpha             = 0.65
text                    = "#D6DEEB"
selected-border         = "#7FDBCA"
selected-border-alpha   = 1.0
unselected-border       = "#1D3B53"
unselected-border-alpha = 0.4
