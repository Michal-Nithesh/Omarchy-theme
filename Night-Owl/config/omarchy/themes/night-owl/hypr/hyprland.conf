# Night Owl Theme for Hyprland
# Canonical palette by Sarah Drasner

$activeBorderColor = rgba(7fdbcaee) rgba(82aaffee) 45deg
$inactiveBorderColor = rgba(1d3b53aa)

general {
    border_size = 2
    gaps_in = 6
    gaps_out = 12
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    resize_on_border = true
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(01162799)
        color_inactive = rgba(01162744)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.012
        vibrancy = 0.20
        popups = false
    }
}

group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}
