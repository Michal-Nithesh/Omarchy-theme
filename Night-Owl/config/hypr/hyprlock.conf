# Night Owl Lock Screen for Hyprlock
# Clean midnight navy aesthetic with high-contrast teal indicators

source = ~/.local/state/omarchy/current/theme/hyprlock.conf

general {
    ignore_empty_input = true
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = ~/.local/state/omarchy/current/background
    color = rgba(1, 22, 39, 1.0)
    blur_passes = 2
    blur_size = 6
    noise = 0.012
}

animations {
    enabled = true
    bezier = nightowlEase, 0.16, 1, 0.3, 1
    bezier = nightowlFade, 0.25, 0.1, 0.25, 1

    animation = fadeIn, 1, 3.0, nightowlFade
    animation = fadeOut, 1, 2.5, nightowlFade
    animation = inputFieldFade, 1, 2.5, nightowlEase
    animation = inputFieldColors, 1, 2.5, nightowlEase
}

# Clock (High visibility)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(214, 222, 235, 0.95)
    font_size = 84
    font_family = Inter Bold, JetBrainsMono Nerd Font Bold

    position = 0, 240
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(1, 14, 26, 0.7)
}

# Date label
label {
    monitor =
    text = cmd[update:1000] echo "🦉 $(date +"%A, %B %d")"
    color = rgba(127, 219, 202, 0.90)
    font_size = 17
    font_family = Inter SemiBold, JetBrainsMono Nerd Font

    position = 0, 175
    halign = center
    valign = center

    shadow_passes = 1
}

# Password Input Field
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.24
    dots_center = true
    dots_rounding = -1

    rounding = 12
    fade_on_empty = false

    inner_color = rgba(11, 37, 58, 0.75)
    font_color = rgba(214, 222, 235, 1.0)
    outer_color = rgba(127, 219, 202, 0.85)

    check_color = rgba(130, 170, 255, 1.0)
    fail_color = rgba(255, 99, 99, 1.0)
    fail_text = <i>Authentication Failed</i>

    placeholder_text = <span foreground="##80A4C2">Enter Password...</span>
    hide_input = false

    position = 0, 40
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(1, 14, 26, 0.5)
}
