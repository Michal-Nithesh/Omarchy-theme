# Night Owl Look & Feel for Hyprland
# Midnight Navy & Teal aesthetic inspired by Sarah Drasner's Night Owl palette

# Border gradients (Hyprland RRGGBBAA hex format)
$nightowlActiveBorder = rgba(7fdbcaee) rgba(82aaffee) 45deg
$nightowlInactiveBorder = rgba(1d3b53aa)

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = $nightowlActiveBorder
    col.inactive_border = $nightowlInactiveBorder
    resize_on_border = true
}

decoration {
    rounding = 10

    active_opacity = 1.0
    inactive_opacity = 0.96

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(01162799)
        color_inactive = rgba(01162744)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.012
        vibrancy = 0.20
        popups = false
    }
}

group {
    col.border_active = $nightowlActiveBorder
    col.border_inactive = $nightowlInactiveBorder
}

cursor {
    no_hardware_cursors = true
    hide_on_key_press = false
    hide_on_touch = false
    inactive_timeout = 0
    invisible = false
    warp_on_change_workspace = 1
}

# Smooth Night Owl transitions
animations {
    enabled = true
    bezier = nightowlEase, 0.16, 1, 0.3, 1
    bezier = nightowlFade, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 3.2, nightowlEase, popin 80%
    animation = windowsOut, 1, 2.8, nightowlFade, popin 80%
    animation = border, 1, 4.0, default
    animation = fade, 1, 2.5, nightowlFade
    animation = workspaces, 1, 3.2, nightowlEase, slide
}
